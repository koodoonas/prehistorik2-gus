name: Publish 1.3 release

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Check for the existing release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3 >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Package DOS and source downloads
        if: steps.release.outputs.exists == 'false'
        run: |
          mkdir release
          cp dist/INSTALL.COM release/
          cp dist/PRE2GUS.COM release/
          cp dos/RUN_GUS.BAT release/
          cp dos/TEST_GUS.BAT release/
          cp docs/README-DOS.TXT release/README.TXT
          cp docs/CHECKSUMS-1.3.TXT release/SHA256.TXT
          cp LICENSE release/LICENSE.TXT
          sed -i 's/$/\r/' release/README.TXT release/SHA256.TXT release/LICENSE.TXT
          (cd release && zip -9 -X ../PRE2GUS-1.3-DOS.zip \
            INSTALL.COM PRE2GUS.COM RUN_GUS.BAT TEST_GUS.BAT \
            README.TXT SHA256.TXT LICENSE.TXT)
          git archive --format=zip --prefix=PRE2GUS-1.3/ \
            -o PRE2GUS-1.3-source.zip HEAD
          sha256sum PRE2GUS-1.3-DOS.zip PRE2GUS-1.3-source.zip \
            > PRE2GUS-1.3-SHA256SUMS.txt
      - name: Publish release
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.3 \
            PRE2GUS-1.3-DOS.zip \
            PRE2GUS-1.3-source.zip \
            PRE2GUS-1.3-SHA256SUMS.txt \
            dist/INSTALL.COM \
            dist/PRE2GUS.COM \
            --target "${{ github.event.workflow_run.head_sha }}" \
            --title "PRE2GUS 1.3" \
            --notes-file docs/RELEASE_NOTES-1.3.md
